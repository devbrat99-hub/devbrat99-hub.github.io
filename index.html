<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVBRAT</title>
<style>
body{
margin:0;
padding:0;
background:linear-gradient(135deg,#667eea,#764ba2);
font-family:Arial;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}
.card{
background:white;
border-radius:25px;
padding:40px 20px;
width:90%;
max-width:400px;
text-align:center;
box-shadow:0 20px 50px rgba(0,0,0,0.3);
}
h1{
color:#667eea;
font-size:50px;
font-weight:900;
margin:0;
}
p{
color:#333;
font-size:18px;
margin:15px 0;
}
button{
padding:15px 40px;
background:#667eea;
color:white;
border:none;
border-radius:50px;
font-size:18px;
font-weight:bold;
margin-top:20px;
}
</style>
</head>
<body>
<div class="card">
<h1>DEVBRAT</h1>
<p>Web Developer</p>
<p>Welcome to my website 😎</p>
<button>Contact Me</button>
</div>
</body>
</html>
