<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEVBRAT CASH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#0a0e1a;color:white;padding-bottom:80px;}
.header{padding:20px;font-size:20px;font-weight:bold;}
.wallet{background:linear-gradient(135deg,#00f260,#0575e6);border-radius:20px;padding:25px;margin:15px;color:black;}
.wallet h3{font-size:14px;opacity:0.8;}
.wallet h1{font-size:40px;margin:10px 0;}
.card{background:#1a1f2e;border-radius:15px;padding:15px;margin:10px 15px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px;}
.box{background:#1a1f2e;border-radius:15px;padding:20px;text-align:center;}
.box h2{font-size:18px;color:#ccc;}
.box h1{font-size:24px;color:#00f260;margin-top:5px;}
.btn{width:90%;margin:10px 5%;padding:15px;background:linear-gradient(135deg,#00f260,#0575e6);border:none;border-radius:15px;color:black;font-size:18px;font-weight:bold;}
.nav{position:fixed;bottom:0;width:100%;background:#1a1f2e;display:flex;justify-content:space-around;padding:10px 0;}
.nav div{text-align:center;font-size:12px;color:#888;}
.nav .active{color:#00f260;}
.orange{background:linear-gradient(135deg,#f7971e,#ffd200);color:black;}
</style>
</head>
<body>

<!-- HOME PAGE -->
<div id="home">
<div class="header">+91 98XXXXXX98</div>
<div class="wallet">
<h3>WALLET BALANCE</h3>
<h1>₹3000.00</h1>
<p>Total earned ₹3000.00 | 30000 MB sold</p>
</div>
<div class="card orange">
👑 Withdraw unlock karne ke liye ₹99 Premium plan lo
</div>
<h2 style="padding:15px;">Data sell karo <span style="float:right;font-size:14px;">10 MB = ₹1</span></h2>
<div class="grid">
<div class="box">📶 10 MB<br><b style="color:#00f260;">+₹1.00</b></div>
<div class="box">📶 50 MB<br><b style="color:#00f260;">+₹5.00</b></div>
<div class="box">📶 100 MB<br><b style="color:#00f260;">+₹10.00</b></div>
<div class="box">📶 250 MB<br><b style="color:#00f260;">+₹25.00</b></div>
</div>
</div>

<!-- BOTTOM NAV -->
<div class="nav">
<div class="active">🏠<br>Home</div>
<div>👥<br>Refer</div>
<div>👑<br>Premium</div>
<div>💰<br>Withdraw</div>
</div>

</body>
</html>
